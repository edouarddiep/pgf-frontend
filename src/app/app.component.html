@if (!isAdminRoute()) {
  <app-header></app-header>
}

<main [class.main-content]="!isAdminRoute()">
  <router-outlet></router-outlet>
</main>

@if (!isAdminRoute()) {
  <app-footer></app-footer>
  <app-cookie-banner></app-cookie-banner>
}

@if (isLoading()) {
  <div class="global-loading-overlay">
    <app-loading-spinner />
  </div>
}
